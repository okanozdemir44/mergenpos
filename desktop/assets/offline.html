<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bağlantı Hatası · Mergen POS</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      user-select: none;
    }
    .card {
      background: rgba(30, 41, 59, 0.85);
      border: 1px solid rgba(148, 163, 184, 0.2);
      backdrop-filter: blur(12px);
      border-radius: 16px;
      padding: 2.5rem 2rem;
      max-width: 480px;
      width: 100%;
      text-align: center;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
    }
    .icon-wrapper {
      width: 72px;
      height: 72px;
      margin: 0 auto 1.5rem auto;
      border-radius: 50%;
      background: rgba(239, 68, 68, 0.15);
      border: 2px solid rgba(239, 68, 68, 0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      animation: pulse 2s infinite ease-in-out;
    }
    @keyframes pulse {
      0%, 100% {
        transform: scale(1);
        box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.4);
      }
      50% {
        transform: scale(1.05);
        box-shadow: 0 0 0 10px rgba(239, 68, 68, 0);
      }
    }
    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 0.75rem;
      letter-spacing: -0.02em;
    }
    p {
      color: #94a3b8;
      font-size: 0.95rem;
      line-height: 1.5;
      margin-bottom: 1.5rem;
    }
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid rgba(148, 163, 184, 0.15);
      padding: 0.5rem 1rem;
      border-radius: 9999px;
      font-size: 0.85rem;
      color: #38bdf8;
      margin-bottom: 1.75rem;
    }
    .spinner {
      width: 14px;
      height: 14px;
      border: 2px solid rgba(56, 189, 248, 0.2);
      border-top-color: #38bdf8;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .retry-btn {
      background: #0284c7;
      color: #ffffff;
      border: none;
      padding: 0.75rem 1.75rem;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      outline: none;
    }
    .retry-btn:hover {
      background: #0369a1;
      transform: translateY(-1px);
    }
    .retry-btn:active {
      transform: translateY(0);
    }
    .target-url {
      margin-top: 1.5rem;
      font-size: 0.75rem;
      color: #64748b;
      word-break: break-all;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon-wrapper">
      ⚡
    </div>
    <h1>Bağlantı Kurulamıyor</h1>
    <p>
      Mergen POS bulut sunucusuna ulaşılamadı. İnternet bağlantınızı veya ağ ayarlarınızı kontrol edin.
    </p>

    <div class="status-badge">
      <div class="spinner"></div>
      <span>Yeniden deneniyor… (<strong id="seconds">5</strong>s)</span>
    </div>

    <div>
      <button class="retry-btn" onclick="retryNow()">Şimdi Tekrar Dene</button>
    </div>

    <div class="target-url" id="targetInfo"></div>
  </div>

  <script>
    let countdown = 5;
    const secondsEl = document.getElementById("seconds");

    // Hedef URL parametresi varsa göster
    const params = new URLSearchParams(window.location.search);
    const targetUrl = params.get("target");
    if (targetUrl) {
      document.getElementById("targetInfo").innerText = "Hedef: " + targetUrl;
    }

    const timer = setInterval(() => {
      countdown--;
      if (secondsEl) secondsEl.innerText = countdown;
      if (countdown <= 0) {
        clearInterval(timer);
        retryNow();
      }
    }, 1000);

    function retryNow() {
      if (targetUrl) {
        window.location.href = targetUrl;
      } else {
        window.location.reload();
      }
    }
  </script>
</body>
</html>
